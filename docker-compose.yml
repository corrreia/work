name: work

services:

  vpn:
    # snx-rs 6.2.4, pinned: releases have changed routing and forwarding
    # behaviour that work.sh depends on. Re-test connect + both guests on bump.
    image: ghcr.io/leleobhz/snx-rs-docker@sha256:e2ac132173e9b6edacddd5a7aab567de1d925e8a9cf8b59d07766f351fc2cff3
    container_name: work-vpn
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    privileged: true
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - 127.0.0.1:8007:8006       # windows web viewer (8007 to avoid omarchy conflict)
      - 127.0.0.1:3390:3389/tcp   # RDP (3390 to avoid omarchy conflict)
      - 127.0.0.1:3390:3389/udp
    restart: no

  windows:
    image: dockurr/windows
    container_name: work-windows
    network_mode: "service:vpn"
    depends_on:
      - vpn
    environment:
      VERSION: "11"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      DISK_SIZE: "128G"
      USERNAME: "${USERNAME}"
      PASSWORD: "${VM_PASSWORD}"
      LANGUAGE: "English"
      REGION: "pt-PT"
      KEYBOARD: "pt-PT"
      VM_NET_DEV: "eth0"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - ./windows:/storage
      - ./shared:/shared
    restart: no
    stop_grace_period: 2m

  linux:
    build:
      context: .
      dockerfile: linux-image/Dockerfile
    image: work-linux:latest
    container_name: work-linux
    network_mode: "service:vpn"
    depends_on:
      - vpn
    environment:
      USERNAME: "${USERNAME}"
      PASSWORD: "${VM_PASSWORD}"
    volumes:
      - ./linux:/home/${USERNAME}
      - ./shared:/shared
      - ./certificates:/usr/local/share/ca-certificates/internal:ro
    restart: no
